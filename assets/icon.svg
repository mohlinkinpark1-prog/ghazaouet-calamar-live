<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Lueur de Veille — encornet phosphore dans le faisceau sodium, lune d'or -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1A2A"/>
      <stop offset="1" stop-color="#0A1624"/>
    </linearGradient>
    <radialGradient id="halo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD278" stop-opacity=".45"/>
      <stop offset="1" stop-color="#FFB629" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB629" stop-opacity=".36"/>
      <stop offset="1" stop-color="#FFB629" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD98A"/>
      <stop offset="1" stop-color="#E09A14"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ACF6E7"/>
      <stop offset="1" stop-color="#3FCDB2"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <!-- lune -->
  <circle cx="49.7" cy="18.5" r="7.5" fill="url(#gold)"/>
  <circle cx="52.1" cy="16.6" r="6.1" fill="#0C1A2A"/>
  <!-- faisceau + lampe -->
  <path d="M12.5 9 L53.7 43.7 L18.7 58.7 Z" fill="url(#beamg)"/>
  <circle cx="12.5" cy="9" r="18" fill="url(#halo)"/>
  <!-- encornet -->
  <g transform="translate(31.2 30.7) rotate(-12)">
    <path d="M0.5 -16 L10.7 -7.7 L3.2 -7.2 Z" fill="url(#sea)" stroke="url(#bg)" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M-0.5 -16 L-10.7 -7.7 L-3.2 -7.2 Z" fill="url(#sea)" stroke="url(#bg)" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M0 -18.5 C3.7 -13 5.7 -6.5 5.7 3 C5.7 9.7 3 13.2 0 13.2 C-3 13.2 -5.7 9.7 -5.7 3 C-5.7 -6.5 -3.7 -13 0 -18.5 Z" fill="url(#sea)" stroke="url(#bg)" stroke-width="1.5"/>
    <circle cx="-2.1" cy="12" r="1.2" fill="url(#bg)"/>
    <circle cx="2.1" cy="12" r="1.2" fill="url(#bg)"/>
    <g fill="none" stroke="url(#sea)" stroke-linecap="round">
      <path d="M0 14.5 L-9 25.7" stroke-width="3.1"/>
      <path d="M0 14.5 L-4 27.7" stroke-width="3.2"/>
      <path d="M0 14.5 L1.5 28.2" stroke-width="3.2"/>
      <path d="M0 14.5 L6.5 26.7" stroke-width="3.1"/>
      <path d="M0 14.5 L10.5 24.5" stroke-width="2.9"/>
      <path d="M-1 15 Q-7.2 23.7 -8.2 31.5" stroke-width="1.9"/>
      <path d="M1.2 15.2 Q8 24.5 9.5 32.2" stroke-width="1.9"/>
    </g>
    <path d="M-4.2 -2 Q0 -3.7 4.2 -2M-4 2.5 Q0 .8 4 2.5M-3.8 7 Q0 5.3 3.8 7" fill="none" stroke="rgba(10,22,36,.25)" stroke-width=".7"/>
  </g>
  <!-- mer -->
  <path d="M5.5 52.5 Q11.5 49.5 17.5 52.5 T29.5 52.5 T41.5 52.5 T53.5 52.5 T64.5 52.5" fill="none" stroke="#48E3C6" stroke-opacity=".92" stroke-width="3.1" stroke-linecap="round"/>
  <path d="M11.5 59 Q17 56.2 22.5 59 T33.5 59 T44.5 59 T55.5 59" fill="none" stroke="#48E3C6" stroke-opacity=".38" stroke-width="2.4" stroke-linecap="round"/>
</svg>
