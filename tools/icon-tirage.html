<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Tirage icône — Lueur de Veille</title>
<style>html,body{margin:0;padding:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="512" height="512"></canvas>
<script>
'use strict';
/* Tirage canvas de l'icône « Lueur de Veille » — 512×512
   Encornet à l'aplomb (nageoires hautes, bras en éventail), remonté
   dans le faisceau sodium d'une lampe de pont. Joints sombres entre
   les masses pour rester lisible à 32 px. */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const BG = '#0A1624', SEA1 = '#3FCDB2', SEA2 = '#ACF6E7';

ctx.beginPath();
ctx.moveTo(120, 0); ctx.arcTo(512, 0, 512, 512, 120); ctx.arcTo(512, 512, 0, 512, 120);
ctx.arcTo(0, 512, 0, 0, 120); ctx.arcTo(0, 0, 512, 0, 120); ctx.closePath();
ctx.clip();

/* ── 1. Encre ── */
const bg = ctx.createLinearGradient(0, 0, 512, 512);
bg.addColorStop(0, '#0C1A2A'); bg.addColorStop(1, BG);
ctx.fillStyle = bg; ctx.fillRect(0, 0, 512, 512);

/* ── 2. Lune d'or (haut-droit) ── */
const gold = ctx.createLinearGradient(0, 84, 0, 250);
gold.addColorStop(0, '#FFD98A'); gold.addColorStop(1, '#E09A14');
ctx.beginPath(); ctx.arc(398, 148, 60, 0, 7); ctx.fillStyle = gold; ctx.fill();
ctx.beginPath(); ctx.arc(417, 133, 49, 0, 7); ctx.fillStyle = '#0C1A2A'; ctx.fill();

/* ── 3. Faisceau sodium : lampe haut-gauche, cône sous le calamar ── */
const lampe = { x: 100, y: 72 };
const beam = ctx.createLinearGradient(lampe.x, lampe.y, 235, 460);
beam.addColorStop(0, 'rgba(255,182,41,.34)'); beam.addColorStop(1, 'rgba(255,182,41,0)');
ctx.beginPath();
ctx.moveTo(lampe.x, lampe.y); ctx.lineTo(430, 350); ctx.lineTo(150, 470); ctx.closePath();
ctx.fillStyle = beam; ctx.fill();
const halo = ctx.createRadialGradient(lampe.x, lampe.y, 6, lampe.x, lampe.y, 145);
halo.addColorStop(0, 'rgba(255,210,120,.45)'); halo.addColorStop(1, 'rgba(255,182,41,0)');
ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(lampe.x, lampe.y, 145, 0, 7); ctx.fill();

/* ── 4. Encornet (léger penché -12°) ── */
ctx.save();
ctx.translate(250, 246); ctx.rotate(-12 * Math.PI / 180);
const sea = ctx.createLinearGradient(-90, 160, 90, -140);
sea.addColorStop(0, SEA1); sea.addColorStop(1, SEA2);
ctx.fillStyle = sea; ctx.strokeStyle = sea;
ctx.lineCap = 'round'; ctx.lineJoin = 'round';

/* ailerons : deux petits triangles symétriques près de la pointe */
ctx.lineWidth = 8; ctx.strokeStyle = BG;
const fin = s => {
  ctx.beginPath();
  ctx.moveTo(4 * s, -128); ctx.lineTo(86 * s, -62); ctx.lineTo(26 * s, -58);
  ctx.closePath();
  ctx.strokeStyle = BG; ctx.lineWidth = 10; ctx.stroke();   // joint sombre
  ctx.fillStyle = sea; ctx.fill();
};
fin(1); fin(-1);

/* manteau : amande pointue en haut, arrondie en bas (tête) */
const manteau = () => {
  ctx.beginPath();
  ctx.moveTo(0, -148);
  ctx.bezierCurveTo(30, -104, 46, -52, 46, 24);
  ctx.bezierCurveTo(46, 78, 24, 106, 0, 106);
  ctx.bezierCurveTo(-24, 106, -46, 78, -46, 24);
  ctx.bezierCurveTo(-46, -52, -30, -104, 0, -148);
  ctx.closePath();
};
manteau(); ctx.strokeStyle = BG; ctx.lineWidth = 12; ctx.stroke();  // joint sombre
manteau(); ctx.fillStyle = sea; ctx.fill();

/* yeux sous la tête */
ctx.fillStyle = BG;
ctx.beginPath(); ctx.arc(-17, 96, 9.5, 0, 7); ctx.fill();
ctx.beginPath(); ctx.arc(17, 96, 9.5, 0, 7); ctx.fill();

/* bras : 5 en éventail vers le bas, deux longs tentacules */
const arm = (x2, y2, w) => {
  ctx.beginPath(); ctx.moveTo(0, 116); ctx.lineTo(x2, y2);
  ctx.strokeStyle = BG; ctx.lineWidth = w + 12; ctx.stroke();   // joint
  ctx.strokeStyle = sea; ctx.lineWidth = w; ctx.stroke();
};
arm(-72, 206, 24); arm(-32, 222, 25); arm(12, 226, 25); arm(52, 214, 24); arm(84, 196, 22);
ctx.beginPath(); ctx.moveTo(-8, 120); ctx.quadraticCurveTo(-58, 190, -66, 252);
ctx.strokeStyle = BG; ctx.lineWidth = 26; ctx.stroke();
ctx.strokeStyle = sea; ctx.lineWidth = 15; ctx.stroke();
ctx.beginPath(); ctx.moveTo(10, 122); ctx.quadraticCurveTo(64, 196, 76, 258);
ctx.strokeStyle = BG; ctx.lineWidth = 26; ctx.stroke();
ctx.strokeStyle = sea; ctx.lineWidth = 15; ctx.stroke();

/* lamelles du manteau : trois fines rayures sombres */
ctx.strokeStyle = 'rgba(10,22,36,.28)'; ctx.lineWidth = 5;
for (const yy of [-24, 12, 48]) {
  ctx.beginPath();
  ctx.moveTo(-34 + yy * .12, yy + 8); ctx.quadraticCurveTo(0, yy - 6, 34 - yy * .12, yy + 8);
  ctx.stroke();
}
ctx.restore();

/* ── 5. Mer phosphore ── */
ctx.strokeStyle = 'rgba(72,227,198,.92)'; ctx.lineWidth = 25;
ctx.beginPath(); ctx.moveTo(44, 420); ctx.quadraticCurveTo(92, 392, 140, 420); ctx.quadraticCurveTo(188, 448, 236, 420);
ctx.quadraticCurveTo(284, 392, 332, 420); ctx.quadraticCurveTo(380, 448, 428, 420); ctx.quadraticCurveTo(476, 392, 516, 420); ctx.stroke();
ctx.strokeStyle = 'rgba(72,227,198,.38)'; ctx.lineWidth = 19;
ctx.beginPath(); ctx.moveTo(92, 472); ctx.quadraticCurveTo(136, 446, 180, 472); ctx.quadraticCurveTo(224, 498, 268, 472);
ctx.quadraticCurveTo(312, 446, 356, 472); ctx.quadraticCurveTo(400, 498, 444, 472); ctx.stroke();
</script>
</body>
</html>
